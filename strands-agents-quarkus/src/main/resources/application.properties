# =============================================================================
# Strands Agent — Quarkus Application Configuration
# =============================================================================

# ---- HTTP / Server ----
quarkus.http.port=8082
quarkus.http.root-path=/

# ---- Web Base Path (for reverse proxy prefixes like /prod/) ----
# Used in Qute templates for <base href>. Override via env STRANDS_WEB_BASE_HREF.
strands.web.base-href=/

# ---- Qute Templating ----
quarkus.qute.suffixes=html
quarkus.qute.content-types.html=text/html

# ---- Micrometer ----
quarkus.micrometer.enabled=true

# ---- Health ----
quarkus.smallrye-health.root-path=/q/health

# ---- OpenAPI / Swagger ----
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ---- OpenTelemetry ----
quarkus.otel.enabled=false

# =============================================================================
# LLM / Model Configuration
# =============================================================================
# These properties are read from environment variables (not from this file).
# application.properties entries are only used when running via Quarkus Dev UI
# and the matching env var is NOT set.

# --- Single-Provider (classic, fallback) ---
# OPENAI_API_KEY=sk-...                    # API key (alternativ via Vault)
# OPENAI_BASE_URL=https://api.openai.com/v1
# OPENAI_MODEL=gpt-4o
# LLM_TEMPERATURE=0.7
# LLM_MAX_RETRIES=3

# --- Multi-Tier: Simple Tier (prefix SIMPLE_) ---
# SIMPLE_PROVIDER=openai                   # openai | ollama | openai-compatible
# SIMPLE_MODEL=gpt-4o-mini
# SIMPLE_API_KEY=sk-...                    # falls abweichend von OPENAI_API_KEY
# SIMPLE_BASE_URL=https://api.openai.com/v1
# SIMPLE_OLLAMA_BASE_URL=http://localhost:11434

# --- Multi-Tier: Advanced Tier (prefix ADVANCED_) ---
# ADVANCED_PROVIDER=openai
# ADVANCED_MODEL=gpt-4o
# ADVANCED_API_KEY=sk-...
# ADVANCED_BASE_URL=https://api.openai.com/v1

# --- Multi-Tier: Routing ---
# LLM_DEFAULT_TIER=simple                  # simple | advanced | routing

# Fallback chain:
#   SIMPLE_* -> OPENAI_* -> Vault -> Fehler
#   ADVANCED_* -> SIMPLE_* -> OPENAI_* -> Vault -> Fehler
# Einzelner Provider (BC): nur OPENAI_* setzen

# =============================================================================
# Agent Configuration
# =============================================================================
strands.agent.temperature=0.7
strands.agent.max-tool-iterations=10

# --- Workspace ---
# Verzeichnis für Dateioperationen (BashTool, ReadTool, etc.)
# strands.agent.workspace=/tmp/strands-workspace

# --- Bash Tool ---
# strands.agent.bash.allow=false

# --- HTTP Tool (private IPs) ---
# strands.agent.http.allow-private=false

# --- Standard-Tools (kommagetrennte Klassen) ---
# strands.agent.tools=de.augmentia.strandsagents.core.tools.CalculatorTool

# --- HITL-Tools (kommagetrennt) ---
# strands.agent.hitl.tools=de.augmentia.strandsagents.core.tools.BashTool

# =============================================================================
# Skills
# =============================================================================
# Verzeichnis mit Skill-Definitionen (.md / .yaml)
strands.agent.skills.dir=skills

# Initial zu aktivierende Skills (kommagetrennt, max 3)
# strands.agent.skills.initial=skill-a,skill-b

# Skill-Search-Tool aktivieren (ermöglicht LLM, Skills selbst zu suchen)
# strands.agent.skills.search=false

# MCP-Skills aus MCP-Servern ingesten
# strands.agent.mcp.ingest=false

# Zusätzliche Capability-Verzeichnisse (kommagetrennt, optional)
# strands.agent.capabilities.dirs=/path/to/more-skills

# =============================================================================
# Sessions
# =============================================================================
# Verzeichnis für Session-Persistenz (JSON-Dateien)
strands.agent.session.dir=.sessions

# =============================================================================
# LLM-Logging
# =============================================================================
strands.agent.llm-log.enabled=true
strands.agent.llm-log.path=logs/llm-calls.log

# =============================================================================
# MCP (Model Context Protocol) Server
# =============================================================================
# JSON-Konfigurationsdatei für MCP-Server
strands.agent.mcp.config=config/MCP_SERVER_CONFIG.json

# =============================================================================
# Prompts (zentralisiertes Prompt-Management)
# =============================================================================
# Externes Verzeichnis mit Prompt-Override-YAML-Dateien.
# Alle .yaml/.yml Dateien werden geladen und überschreiben die eingebauten
# Prompts aus prompts.yaml. Format identisch:
#
#   prompts:
#     routing_agent.classifier: "Dein custom Prompt..."
#     agent.llm_error: "Alternativer Fehlertext %s"
#
# strands.agent.prompts.override-dir=config/prompts

# =============================================================================
# Vault (Hashicorp Vault für API-Keys)
# =============================================================================
# Setze VAULT_ADDR und VAULT_TOKEN um Vault zu aktivieren.
# Erwartete Pfade:
#   secret/openai  -> key "api_key"  (OPENAI_API_KEY fallback)
#   secret/tavily  -> key "api_key"  (TAVILY_API_KEY fallback)
# Ohne Vault werden plain env vars verwendet.
# VAULT_ADDR=http://localhost:8200
# VAULT_TOKEN=s.your-token-here
# VAULT_MOUNT_PATH=secret

# =============================================================================
# API-Key Vault (eigener AES-verschlüsselter Key-Store, Web-UI)
# =============================================================================
# Pfad zur verschlüsselten Key-Datei (optional)
# JSTRANDS_KEY_PATH=.jstrands-keys.json

# =============================================================================
# Tavily WebSearch
# =============================================================================
# TAVILY_API_KEY=tvly-...                  # https://tavily.com

# =============================================================================
# A2A Protocol (Agent-to-Agent)
# =============================================================================
agent.url=http://localhost:8082
a2a.enabled=false
# a2a.agent.name=Strands Demo Agent
# a2a.agent.description=Demo agent for A2A protocol testing
# a2a.system-prompt=You are a helpful demo agent. Use your tools to answer questions.
a2a.tools=list_tools,web_search,read
# a2a.session-timeout-seconds=300

# =============================================================================
# Testing / Chaos Engineering (NUR zu Testzwecken!)
# =============================================================================
# RANDOM_TOOL_ERRORS_ENABLED=false
# RANDOM_TOOL_TIMEOUT_PROBABILITY=0.0
# RANDOM_TOOL_EXCEPTION_PROBABILITY=0.0
# RANDOM_TOOL_INVALID_JSON_PROBABILITY=0.0

# =============================================================================
# Cloud Secret Store (pluggable)
# =============================================================================
# Liest API-Keys aus dem nativen Cloud-Secret-Store des jeweiligen Providers.
# Kein AWS/GCP SDK nötig — reine HTTP-Calls via Lambda Extension,
# Metadata Server oder Managed Identity.
#
# Verfügbare Provider: aws | gcp (kein default)
# strands.secret.cloud.provider=
#
# --- AWS SSM Parameter Store ---
# SSM-Pfad zum Parameter (z.B. /cloud-quarkus/openai-api-key)
# strands.secret.aws.ssm.path=
#
# --- GCP Secret Manager ---
# strands.secret.gcp.project-id=            # optional, wird automatisch erkannt
# strands.secret.gcp.secret-id=             # Name des Secrets
# Erweiterte Auflösungskette in SecretService:
#   runtimeKey → Vault → CloudSecretProvider → env var → MockChatModel

# =============================================================================
# Jackson / REST Client
# =============================================================================
quarkus.jackson.fail-on-empty-beans=false
quarkus.rest-client.logging.scope=all
quarkus.rest-client.logging.body-limit=5000
# Explicitly tell Quarkus which headers contain sensitive values to obfuscate
quarkus.rest-client.logging.masked-headers=Authorization,X-Title,HTTP-Referer

# =============================================================================
# LangChain4j OpenAI
# =============================================================================
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true
# quarkus.langchain4j.openai.log-requests-curl=true
# quarkus.langchain4j.openai.jackson.allow-missing-values=true (NOT SUPPORTED)

# =============================================================================
# Quarkus Native Build
# =============================================================================
quarkus.native.container-build=true
quarkus.native.native-image-xmx=8g
quarkus.native.report-errors-at-runtime=true
quarkus.native.auto-service-loader-registration=true
quarkus.native.additional-build-args=--initialize-at-run-time=de.augmentia.strandsagents.core.ToolExecutor
quarkus.native.resources.includes=*.yaml,*.yml,*.properties,workflows/*.yaml




# Der Empfänger für die HITL-Checkpoints
strands.hitl.email.recipient=admin@deine-domain.de
