quarkus.http.port=8082
quarkus.http.root-path=/

# Qute
quarkus.qute.suffixes=html
quarkus.qute.content-types.html=text/html

# Micrometer
quarkus.micrometer.enabled=true

# Health
quarkus.smallrye-health.root-path=/q/health

# OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# OpenTelemetry
quarkus.otel.enabled=false

# Strands Agent Config
strands.agent.temperature=0.7
strands.agent.max-tool-iterations=10

# Skills directory (relative to working dir or absolute)
strands.agent.skills.dir=skills

# Session storage
strands.agent.session.dir=.sessions

# LLM logging
strands.agent.llm-log.enabled=true
strands.agent.llm-log.path=logs/llm-calls.log

# Default tools — all tool capabilities come via MCP servers
# strands.agent.tools=

# MCP server config file (JSON, siehe config/MCP_SERVER_CONFIG.json)
strands.agent.mcp.config=config/MCP_SERVER_CONFIG.json

# Quarkus Native Build
quarkus.native.container-build=true
quarkus.native.native-image-xmx=8g
quarkus.native.report-errors-at-runtime=true
quarkus.native.auto-service-loader-registration=true
quarkus.native.additional-build-args=--initialize-at-run-time=de.augmentia.strandsagents.core.ToolExecutor
quarkus.native.resources.includes=*.yaml,*.yml,*.properties,workflows/*.yaml

# Optional Vault for API-Key resolution
# Set VAULT_ADDR=http://localhost:8200 and VAULT_TOKEN=<token> to activate.
# Vault paths expected:
#   secret/openai  \u2192 key "api_key"  (OPENAI_API_KEY fallback)
#   secret/tavily  \u2192 key "api_key"  (TAVILY_API_KEY fallback)
# Without these env vars, plain env vars are used.

# Erlaubt es Jackson, leere Beans zu serialisieren (oft nützlich für DTOs)
quarkus.jackson.fail-on-empty-beans=false
# Enable logging for the REST client
quarkus.rest-client.logging.scope=all
quarkus.rest-client.logging.body-limit=5000

# LLM Request/Response Logging (Hilfreich bei leeren Antworten/OpenRouter Problemen)
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true
# quarkus.langchain4j.openai.log-requests-curl=true

# Falls du direkten Zugriff auf das Objectmapping von LangChain4j hast (nur zur Info):
# quarkus.langchain4j.openai.jackson.allow-missing-values=true (NICHT UNTERSTÜTZT)