quarkus.http.port=8082
quarkus.http.root-path=/

# Qute
quarkus.qute.suffixes=html
quarkus.qute.content-types.html=text/html

# Micrometer
quarkus.micrometer.enabled=true
quarkus.micrometer.export.json=true

# Health
quarkus.smallrye-health.root-path=/q/health

# OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# OpenTelemetry
quarkus.otel.enabled=false

# Strands Agent Config
strands.agent.temperature=0.7
strands.agent.max-tool-iterations=10

# Skills directory (relative to working dir or absolute)
strands.agent.skills.dir=skills

# Session storage
strands.agent.session.dir=.sessions

# LLM logging
strands.agent.llm-log.enabled=true
strands.agent.llm-log.path=logs/llm-calls.log

# Default tools (comma separated class names)
strands.agent.tools=com.strands.agents.core.tools.CalculatorTool

# Default MCP server URL (can be overridden in UI)
strands.agent.mcp.url=http://localhost:8888/mcp
