run:
  variant: 0
  label: "initial"
  timestamp: "2026-05-21T00:00:00Z"

model:
  type: "mock"
  responseTemplate: "Mock-Antwort: %s"

tools:
  preset: "standard"
  additional:
    - "de.augmentia.strandsagents.core.tools.CalculatorTool"
  include: ~
  exclude: ~

conversation:
  type: "sliding"
  windowSize: 10

session:
  type: "file"
  directory: ".sessions"

resilience:
  enabled: true
  retry:
    maxAttempts: 3
    backoffDelayMs: 1000
    backoffMultiplier: 2.0
  circuitBreaker:
    failureRateThreshold: 0.5
    slidingWindowSeconds: 10
    halfOpenDelaySeconds: 30

plugins:
  guardrail:
    enabled: true
    blockAction: "THROW"
    fallbackMessage: "Blocked by guardrail"
  hitl:
    enabled: false
    authority: "AUTO"
    mode: "SYNC_BLOCKING"

hooks:
  - name: "logging"
    enabled: false

structuredOutput:
  enabled: false
  mode: "STATIC"
  outputClass: ~
  forcePrompt: ~

systemPrompt: "You are a helpful test assistant. Answer concisely."
testPrompt: "What is 2+2?"

# Die erste Variante (Agent + SlidingWindow + FileSession + Resilience + Guardrail)
asserts:
  stopReason:
    - "COMPLETED"
    - "MAX_ITERATIONS"
  finalAnswerNotNull: true
  metricsDurationMsMin: 0
  metricsToolCallsMin: 0
  expectedOutputContains: ~
  expectedOutputNotContains: ~

nextVariant:
  strategy: "linear"
  dimensions:
    - "tools.preset"
    - "conversation.type"
    - "session.type"
    - "resilience.enabled"
    - "plugins.guardrail.enabled"
    - "plugins.hitl.enabled"
    - "hooks"
    - "structuredOutput.enabled"
  seed: 42
