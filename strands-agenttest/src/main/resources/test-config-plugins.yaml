run:
  variant: 0
  label: "plugin_hook_configs"
  timestamp: "2026-05-21T00:00:00Z"

model:
  type: "mock"
  responseTemplate: "Mock-%s"

tools:
  preset: "minimal"
  additional: ~
  include: ~
  exclude: ~

conversation:
  type: "sliding"
  windowSize: 20

session:
  type: "file"
  directory: ".sessions-test"

resilience:
  enabled: false
  retry:
    maxAttempts: 3
    backoffDelayMs: 1000
    backoffMultiplier: 2.0
  circuitBreaker:
    failureRateThreshold: 0.5
    slidingWindowSeconds: 10
    halfOpenDelaySeconds: 30

plugins:
  guardrail:
    enabled: true
    blockAction: "FALLBACK"
    fallbackMessage: "Content not allowed by guardrail"
  hitl:
    enabled: true
    authority: "AUTO"
    mode: "SYNC_BLOCKING"

hooks:
  - name: "logging"
    enabled: true

structuredOutput:
  enabled: false
  mode: "STATIC"
  outputClass: ~
  forcePrompt: ~

systemPrompt: "You are a test assistant."
testPrompt: "What tools do I have?"

asserts:
  stopReason:
    - "COMPLETED"
    - "MAX_ITERATIONS"
  finalAnswerNotNull: true
  metricsDurationMsMin: 0
  metricsToolCallsMin: 0
  expectedOutputContains: ~
  expectedOutputNotContains: ~

nextVariant:
  strategy: "exhaustive"
  dimensions:
    - "plugins.guardrail.enabled"
    - "plugins.hitl.enabled"
    - "hooks"
    - "session.type"
  seed: 42
