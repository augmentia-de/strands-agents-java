# Strands Agent Configuration (Properties)
strands.agent.model=gpt-4o-mini
strands.agent.api-key=${OPENAI_API_KEY}
strands.agent.base-url=https://api.openai.com
strands.agent.temperature=0.5
strands.agent.system-prompt=You are a properties-configured assistant.
strands.agent.max-iterations=20
strands.agent.max-messages=40
strands.agent.provider=OPENAI
strands.agent.tools=de.augmentia.strandsagents.features.tools.WebSearchTool,de.augmentia.strandsagents.features.tools.WebFetchTool
strands.agent.skills.dir=skills
strands.agent.skills.initial=general,coding
