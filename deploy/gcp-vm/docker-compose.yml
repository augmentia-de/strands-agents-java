services:

  filesystem-mcp:
    image: node:22-slim
    container_name: filesystem-mcp
    ports:
      - "3000:8080"
    working_dir: /workspace
    command:
      - npx
      - "-y"
      - mcp-proxy
      - "--port"
      - "8080"
      - "--"
      - npx
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - .
    volumes:
      - ./shared_data/workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/sse',r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  strands-agent:
    image: strands-agent:latest
    container_name: strands-agent
    depends_on:
      filesystem-mcp:
        condition: service_healthy
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - STRANDS_SKILLS_DIR=/work/skills
      - STRANDS_AGENT_TOOLS=de.augmentia.strandsagents.core.tools.CalculatorTool
      - JSTRANDS_KEY_PATH=/work/config/api-key.enc
      - STRANDS_AGENT_MCP_CONFIG=/work/config/MCP_SERVER_CONFIG.json
      - STRANDS_AGENT_WORKSPACE=/work/workspace
    volumes:
      - ./config:/work/config
      - ./.sessions:/work/.sessions
      - ./logs:/work/logs
      - ./shared_data/workspace:/work/workspace
    restart: unless-stopped
