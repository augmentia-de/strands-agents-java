resources:
  - name: strands-agent-cluster
    type: container.v1.cluster
    properties:
      zone: europe-west1-b
      cluster:
        name: strands-agent-cluster
        initialClusterVersion: latest
        nodePools:
          - name: default-pool
            initialNodeCount: 3
            config:
              machineType: e2-standard-2
              oauthScopes:
                - https://www.googleapis.com/auth/cloud-platform
              diskSizeGb: 100
              diskType: pd-standard
        network: default

  - name: strands-agent-sa
    type: iam.v1.serviceAccount
    properties:
      accountId: strands-agent-sa
      displayName: Strands Agent Service Account
