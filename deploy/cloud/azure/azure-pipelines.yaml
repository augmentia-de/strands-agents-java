trigger:
  branches:
    include:
      - main
      - develop

variables:
  dockerRegistryServiceConnection: 'acr-connection'
  imageRepository: 'strands-agent'
  containerRegistry: '$(AZURE_ACR_NAME).azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/strands-agents-quarkus/src/main/docker/Dockerfile.native'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build and Push Container
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and Push Container
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    jobs:
      - deployment: DeployToAKS
        displayName: Deploy to AKS
        pool:
          vmImage: $(vmImageName)
        environment: 'strands-agent-aks'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmDeploy@0
                  displayName: Helm Upgrade
                  inputs:
                    command: upgrade
                    chartType: 'FilePath'
                    chartPath: 'deploy/helm/strands-agent'
                    releaseName: 'strands-agent'
                    namespace: 'strands'
                    valueFile: 'deploy/helm/strands-agent/values.yaml'
                    overrideValues: 'image.repository=$(containerRegistry)/$(imageRepository),image.tag=$(tag)'
                    connectionType: 'KubernetesServiceConnection'
                    kubernetesServiceConnection: 'aks-connection'
