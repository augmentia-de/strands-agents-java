apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strands-agent.fullname" . }}
  labels:
    {{- include "strands-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "strands-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "strands-agent.labels" . | nindent 8 }}
      {{- if .Values.prometheus.serviceMonitor.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.port }}"
      {{- end }}
    spec:
      containers:
        - name: strands-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "strands-agent.fullname" . }}-config
            - secretRef:
                name: {{ include "strands-agent.fullname" . }}-secret
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.health.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          {{- end }}
          {{- if .Values.vault.agentInject }}
          vault.hashicorp.com/agent-inject: "true"
          vault.hashicorp.com/role: "strands-agent"
          vault.hashicorp.com/agent-inject-secret-api-key: "secret/data/openai"
          vault.hashicorp.com/agent-inject-template-api-key: |
            {{`{{- with secret "secret/data/openai" -}}
            export OPENAI_API_KEY={{ .Data.data.api_key }}
            {{- end -}}`}}
          {{- end }}
