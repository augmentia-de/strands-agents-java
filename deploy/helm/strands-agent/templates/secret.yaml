apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strands-agent.fullname" . }}-secret
  labels:
    {{- include "strands-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.env.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | quote }}
  {{- end }}
  {{- if and .Values.vault.enabled .Values.env.VAULT_TOKEN }}
  VAULT_TOKEN: {{ .Values.env.VAULT_TOKEN | quote }}
  {{- end }}
