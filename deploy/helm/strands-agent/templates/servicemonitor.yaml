{{- if .Values.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "strands-agent.fullname" . }}
  labels:
    {{- include "strands-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "strands-agent.labels" . | nindent 6 }}
  endpoints:
    - port: http
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      path: /metrics
{{- end }}
