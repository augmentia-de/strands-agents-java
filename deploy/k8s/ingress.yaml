apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: strands-agent
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - strands-agent.example.com
      secretName: strands-agent-tls
  rules:
    - host: strands-agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: strands-agent
                port:
                  number: 80
