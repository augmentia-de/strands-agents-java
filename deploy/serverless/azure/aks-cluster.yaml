apiVersion: containerapp.azure.com/v1beta2
kind: Cluster
metadata:
  name: strands-agent-aks
  resourcegroup: strands-agent-rg
spec:
  location: westeurope
  properties:
    kubernetesVersion: 1.30
    dnsPrefix: strands-agent
    agentPoolProfiles:
      - name: agentpool
        count: 3
        vmSize: Standard_D2s_v3
        osType: Linux
        mode: System
    networkProfile:
      networkPlugin: azure
      loadBalancerSku: standard
    identity:
      type: SystemAssigned
---
apiVersion: containerservice.azure.com/v1beta2
kind: ManagedCluster
metadata:
  name: strands-agent-aks
  resourcegroup: strands-agent-rg
spec:
  location: westeurope
  properties:
    kubernetesVersion: 1.30
    dnsPrefix: strands-agent
    agentPoolProfiles:
      - name: agentpool
        count: 3
        vmSize: Standard_D2s_v3
    identity:
      type: SystemAssigned
    addonProfiles:
      keyvaultFlexVolume:
        enabled: true
      omsagent:
        enabled: true
        logAnalyticsWorkspaceResourceId: /subscriptions/SUB_ID/resourceGroups/strands-agent-rg/providers/Microsoft.OperationalInsights/workspaces/strands-agent-logs
