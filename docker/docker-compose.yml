services:
  strands-agent:
    build:
      context: ..
      dockerfile: strands-agents-quarkus/src/main/docker/Dockerfile.jvm
    image: strands-agent:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - QUARKUS_HTTP_PORT=8084
      - STRANDS_AGENT_TOOLS=de.augmentia.strandsagents.core.tools.CalculatorTool
      - STRANDS_SKILLS_DIR=/app/skills
    ports:
      - "8084:8084"
    volumes:
      - ./data:/app/data
      - ../skills:/app/skills
      - ../config/MCP_SERVER_CONFIG.json:/app/config/MCP_SERVER_CONFIG.json:ro
    restart: unless-stopped

  filesystem-mcp:
    image: node:21-alpine
    command:
      - sh
      - -c
      - |
        npx -y supergateway \
          --stdio "npx -y @modelcontextprotocol/server-filesystem /data" \
          --port 3000
    ports:
      - "3001:3000"
    volumes:
      - ../workspace:/data
    networks:
      - strands-net
    restart: unless-stopped

networks:
  strands-net:
    driver: bridge
