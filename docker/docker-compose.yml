services:
  strands-agent:
    build:
      context: ..
      dockerfile: strands-agents-quarkus/src/main/docker/Dockerfile.jvm
    image: strands-agent:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - QUARKUS_HTTP_PORT=8084
      - STRANDS_AGENT_TOOLS=de.augmentia.strandsagents.core.tools.CalculatorTool
      - STRANDS_SKILLS_DIR=/app/skills
      - STRANDS_MCP_URL=${STRANDS_MCP_URL:-http://mcp-server:3000/mcp}
    ports:
      - "8084:8084"
    volumes:
      - ./data:/app/data
      - ../skills:/app/skills
    restart: unless-stopped
