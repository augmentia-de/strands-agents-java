services:
  strands-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: strands-agent:latest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?required}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-gpt-4o}
      - STRANDS_AGENT_TOOLS=com.strands.agents.core.tools.CalculatorTool
      - STRANDS_SKILLS_DIR=/app/skills
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ../skills:/app/skills
    restart: unless-stopped
