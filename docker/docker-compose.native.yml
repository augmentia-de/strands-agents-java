services:
  strands-agent:
    build:
      context: ..
      dockerfile: strands-agents-quarkus/src/main/docker/Dockerfile.native
    image: strands-agent:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    environment:
      - QUARKUS_HTTP_PORT=8082
      - STRANDS_AGENT_TOOLS=de.augmentia.strandsagents.core.tools.CalculatorTool
      - STRANDS_SKILLS_DIR=/work/skills
      - JSTRANDS_KEY_PATH=/work/config/api-key.enc
      - STRANDS_AGENT_MCP_CONFIG=/work/config/MCP_SERVER_CONFIG.json
    ports:
      - "8082:8082"
    volumes:
      - ./data:/work/data
      - ../skills:/work/skills
      - ../config:/work/config
    networks:
      - strands-net
    restart: unless-stopped

  filesystem-mcp:
    image: node:21-alpine
    command:
      - sh
      - -c
      - |
        npx -y supergateway \
          --stdio "npx -y @modelcontextprotocol/server-filesystem /data" \
          --port 3000
    ports:
      - "3001:3000"
    volumes:
      - ../workspace:/data
    networks:
      - strands-net
    restart: unless-stopped

networks:
  strands-net:
    driver: bridge
